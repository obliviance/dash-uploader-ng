[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license` / `license-files`
# fields used below. This only constrains the *build* environment, not the
# runtime -- installing the built wheel still works on Python 3.8+.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-uploader-ng"
version = "1.3.0"
description = "Large file upload component for Dash -- a maintained, security-patched fork of dash-uploader"
readme = "docs/README-PyPi.md"
requires-python = ">=3.8"
# PEP 639: SPDX expression + explicit license files. Replaces the deprecated
# `license = {text = ...}` table and the "License :: OSI Approved" classifier.
license = "MIT"
license-files = ["LICENSE.txt"]
# Upstream authorship is retained: this is a fork of Niko Föhr's dash-uploader,
# and the MIT licence's attribution requirement is met by keeping both the
# original copyright in LICENSE.txt and the original author here.
authors = [
    { name = "Niko Föhr", email = "fohrloop@gmail.com" },
]
# Maintainers of the fork, as distinct from `authors` above (upstream, kept for
# MIT attribution). No email is published here deliberately: PyPI renders it
# publicly and it gets scraped, and this metadata is immutable once a version is
# uploaded. Security reports are routed through GitHub instead -- see
# SECURITY.md and [project.urls].Security.
maintainers = [
    { name = "Awwab Mahdi" },
    { name = "Claude (Anthropic)" },
]
keywords = ["dash", "upload", "plotly", "flow.js", "file-upload"]
classifiers = [
    "Framework :: Dash",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upstream dash-uploader's floor, kept deliberately: the fork is verified
    # working on dash 1.21 as well as 4.x, and raising it would turn a drop-in
    # replacement into an upgrade. Note dash 1.x itself requires werkzeug<2.1.
    "dash>=1.1.0",
    # packaging is used by utils.py for the dash version comparison.
    "packaging>=21.0",
]

[project.optional-dependencies]
# Fast, headless test suite (path-safety unit tests + the CVE-2026-38360
# end-to-end tests). The Selenium browser suite has its own requirements file
# at tests/browser/requirements.txt.
test = [
    "pytest>=7.0",
    "flask>=2.0",
]

[project.urls]
Homepage = "https://github.com/obliviance/dash-uploader-ng"
Repository = "https://github.com/obliviance/dash-uploader-ng"
Issues = "https://github.com/obliviance/dash-uploader-ng/issues"
Security = "https://github.com/obliviance/dash-uploader-ng/blob/main/SECURITY.md"

[tool.setuptools]
# The importable package is dash_uploader_ng, including the generated _build
# subpackage. The JS bundle and dash component metadata under _build/ are data
# files that must ship in the wheel; they are produced by `npm run build` and
# are not in version control (see .gitignore), so an sdist/wheel build must run
# the JS build first.
packages = ["dash_uploader_ng", "dash_uploader_ng._build"]

[tool.setuptools.package-data]
dash_uploader_ng = [
    "_build/*.js",
    "_build/*.js.map",
    "_build/*.json",
    # webpack emits this alongside the bundle to carry the bundled libraries'
    # licence banners; it is referenced by a comment in the .min.js.
    "_build/*.LICENSE.txt",
]

[tool.pytest.ini_options]
# Default run is the fast, headless suite: the path-safety unit tests, the
# CVE-2026-38360 end-to-end tests, and the UploadStatus test. The Selenium
# browser suite under tests/browser/ needs a real Chrome + chromedriver and is
# opted into explicitly (`pytest tests/browser`).
testpaths = ["tests"]
norecursedirs = ["tests/browser"]
addopts = "-rsxX -vv"
log_format = "%(asctime)s | %(levelname)s | %(name)s:%(lineno)d | %(message)s"
log_cli_level = "ERROR"
